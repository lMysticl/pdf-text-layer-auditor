name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit in main" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tag matches project version
        id: version
        shell: bash
        run: |
          project_version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          expected_tag="v${project_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${project_version}" >&2
            exit 1
          fi
          echo "value=${project_version}" >> "${GITHUB_OUTPUT}"

      - name: Build and test
        run: mvn --batch-mode clean verify

      - name: Create checksum
        working-directory: target
        run: sha256sum pdf-text-layer-auditor.jar > pdf-text-layer-auditor.jar.sha256

      - name: Attest release artifacts
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            target/pdf-text-layer-auditor.jar
            target/pdf-text-layer-auditor.jar.sha256
            target/bom.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          target/pdf-text-layer-auditor.jar
          target/pdf-text-layer-auditor.jar.sha256
          target/bom.json
          --verify-tag
          --generate-notes
          --title "PDF Text Layer Auditor ${{ steps.version.outputs.value }}"
