name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify reproducible release artifacts
        shell: bash
        run: |
          evidence_dir="$(mktemp -d "${RUNNER_TEMP}/pdf-auditor-repro.XXXXXX")"
          trap 'rm -rf "${evidence_dir}"' EXIT

          cp target/pdf-text-layer-auditor.jar "${evidence_dir}/first.jar"
          cp target/bom.json "${evidence_dir}/first-bom.json"

          mvn --batch-mode --no-transfer-progress clean verify

          cmp "${evidence_dir}/first.jar" target/pdf-text-layer-auditor.jar
          cmp "${evidence_dir}/first-bom.json" target/bom.json
          sha256sum "${evidence_dir}/first.jar" target/pdf-text-layer-auditor.jar
          sha256sum "${evidence_dir}/first-bom.json" target/bom.json

  action-smoke:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the action against this pull request
        id: pdf-audit
        uses: ./
        with:
          token: ${{ github.token }}
          fail_on_findings: "false"

      - name: Upload the action report
        if: always() && steps.pdf-audit.outputs.report_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdf-text-layer-audit
          path: ${{ steps.pdf-audit.outputs.report_path }}
          if-no-files-found: error
